name: nextfin
description: A polished, compatibility-first Jellyfin client built with Flutter.
publish_to: none
version: 1.0.1+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  video_player: ^2.9.5
  google_fonts: ^6.2.1
  intl: ^0.20.2
  shimmer: ^3.0.0
  connectivity_plus: ^6.1.4
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
